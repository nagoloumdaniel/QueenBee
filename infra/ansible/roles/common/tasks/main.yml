---
# Socle commun : paquets, mises à jour de sécurité, pare-feu, durcissement SSH.
- name: Mettre à jour le cache apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Installer les paquets de base
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Activer les mises à jour de sécurité automatiques
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

