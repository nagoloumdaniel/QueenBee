[defaults]
inventory = inventories/staging/hosts.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
# Secrets : ansible-vault ou SOPS/age (ROADMAP §5.7). Aucun mot de passe dans ce dépôt.
# vault_password_file = ~/.queenbee-vault-pass

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
