# Inventaire staging. Les adresses 192.0.2.0/24 sont des adresses de documentation (RFC 5737) :
# les remplacer par les vraies IP (sortie Terraform `central_public_ip` pour le central).
all:
  vars:
    ansible_user: ubuntu
    qb_environment: staging
  children:
    central:
      hosts:
        queenbee-central-staging:
          ansible_host: 192.0.2.10
    sites:
      hosts:
        gw-sn-casa:
          ansible_host: 192.0.2.101   # TODO(EP-00, [INFRA]): IP réelle du site pilote (VPN WireGuard)
          site_code: SN-CASA
