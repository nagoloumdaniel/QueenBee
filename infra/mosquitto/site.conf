# Mosquitto de site : broker local + bridge vers le central. Persistance disque = cache en cas de coupure.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
log_dest stdout

# Broker local pour les capteurs / la passerelle LoRa et le service acoustique (réseau IoT du site).
listener 1883
allow_anonymous true          # TODO(EP-05, [EDGE]): authentification locale + ACL dès que le réseau le permet

max_queued_messages 1000000   # file locale en mode dégradé (coupure de liaison)

# ---------------------------------------------------------------------------------------------
# BRIDGE site -> central (à activer par le ticket EP-05 [EDGE]).
# Principe : toute trame publiée localement sous queenbee/{site}/# est relayée au central en QoS 1.
# Si la liaison tombe, Mosquitto garde les messages en file (cleansession false + persistance) puis
# les rejoue à la reconnexion : « zéro perte » et rattrapage rapide (cible : 1 jour < 2 min).
#
# connection central
# address central.queenbee.example.org:8883      # via le VPN WireGuard (IP 10.200.0.1)
# remote_clientid gw-${QB_SITE_CODE}              # remplacer par le code réel (ex. gw-sn-casa)
# local_clientid  bridge-${QB_SITE_CODE}
# topic queenbee/# out 1                          # sortant, QoS 1
# topic queenbee/+/cmd/# in 1                     # commandes de config entrantes (rétention côté central)
# cleansession false                              # conserve les abonnements et la file pendant la coupure
# start_type automatic
# restart_timeout 5 60                            # reconnexion avec attente exponentielle bornée
# keepalive_interval 30
# try_private true
#
# bridge_cafile   /mosquitto/certs/ca.crt
# bridge_certfile /mosquitto/certs/client.crt     # certificat client de la passerelle (jamais dans le dépôt)
# bridge_keyfile  /mosquitto/certs/client.key
# bridge_tls_version tlsv1.3
# bridge_insecure false
# ---------------------------------------------------------------------------------------------
