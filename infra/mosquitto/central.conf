# Mosquitto central : reçoit les bridges des sites (TLS 1.3, authentification obligatoire).
# Les certificats et fichiers de mots de passe sont montés par Ansible (jamais dans le dépôt).
persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.3
# Chaque passerelle présente un certificat client ; l'identité (CN) sert d'utilisateur.
require_certificate true
use_identity_as_username true

allow_anonymous false
# TODO(EP-05, [EDGE]): acl_file limitant chaque site à queenbee/{site}/# (écriture) ;
# les services internes (ingest) lisent queenbee/#. Voir acl.conf.example.
# acl_file /mosquitto/config/acl.conf

# Files de messages hors ligne : conserve les messages QoS 1 pour les clients persistants.
max_queued_messages 100000
