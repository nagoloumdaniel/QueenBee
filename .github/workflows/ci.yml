name: CI

# Lint + tests + build, un job par application. Porte qualité : couverture, lint, types.
on:
  push:
    branches: [main, "phase/**"]
  pull_request:
    branches: [main, "phase/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      - name: Tests (unitaires + intégration Testcontainers)
        # TODO(EP-06, [CI]): ajouter --cov-fail-under=80 (porte ROADMAP §5.3) quand les services existent.
        run: pytest -m "not e2e"

  ingest:
    name: Ingest (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ingest/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest -m "not integration"

  edge-acoustic:
    name: Edge acoustic (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/edge-acoustic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/edge-acoustic/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest

  simulator:
    name: Simulateur (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/simulator/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest

  web:
    name: Web (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test --if-present
      - run: npm run build

  mobile:
    name: Mobile Flutter (analyse, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  infra-lint:
    name: Infra (compose, yaml, ansible, terraform fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valider les fichiers compose
        run: |
          cp infra/compose/.env.example infra/compose/.env
          for f in dev central site e2e; do docker compose -f "infra/compose/$f.yml" config --quiet; done
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra/terraform
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yamllint ansible-lint
      - run: yamllint -d relaxed infra monitoring n8n .github
      - run: cd infra/ansible && ansible-lint --offline

  build-images:
    name: Build images (sans publication)
    needs: [api, ingest, edge-acoustic, simulator]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, ingest, edge-acoustic, simulator]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-arch (amd64 + arm64), sans push
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
