name: Release

# Déclenchée par un tag SemVer vX.Y.Z : build multi-arch, publication GHCR, SBOM CycloneDX,
# analyse Trivy de l'image, signature cosign (sans clé, OIDC).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  images:
    name: Publier ${{ matrix.app }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push GHCR
      id-token: write          # signature cosign keyless
    strategy:
      fail-fast: false
      matrix:
        app: [api, ingest, edge-acoustic, simulator, web]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/queenbee-${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: false
      - name: Analyse Trivy de l'image publiée (bloque si critique/haute)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM CycloneDX
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.app }}.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.app }}
          path: sbom-${{ matrix.app }}.cdx.json
      - uses: sigstore/cosign-installer@v3
      - name: Signer l'image (par digest)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

  github-release:
    name: Notes de version
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sbom-*
          path: sboms
          merge-multiple: true
      - name: Créer la release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" sboms/* --generate-notes --verify-tag
