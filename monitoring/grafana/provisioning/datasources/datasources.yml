apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100

  # Base QueenBee : alimente les dashboards Déploiements et Files de sync (tables deployment, ...).
  # À utiliser avec un rôle PostgreSQL en LECTURE SEULE (TODO EP-10 : créer le rôle `grafana_ro`).
  - name: QueenBee DB
    uid: queenbee-db
    type: postgres
    access: proxy
    url: postgres:5432
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: queenbee
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
