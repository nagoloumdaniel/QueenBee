# Promtail d'un site : envoie les logs des conteneurs vers le Loki central (via le VPN).
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://10.200.0.1:3100/loki/api/v1/push     # Loki central, via WireGuard

scrape_configs:
  - job_name: docker
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          # TODO(EP-10, [OBS]): label site = code du site (injecté par Ansible).
          __path__: /var/lib/docker/containers/*/*-json.log
    # Règle : pas de PII en clair dans les logs ; ne pas ajouter d'étapes qui en créent.
