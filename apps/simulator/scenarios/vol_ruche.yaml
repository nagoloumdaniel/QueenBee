# Déplacement non déclaré (vol de ruche, UC-CY04) : dérive GPS au-delà de tolerance_m.
scenario: vol_ruche_cm_dsch_012
description: "La position GPS dérive de plusieurs centaines de mètres sans déclaration de déplacement."
target: { hive: CM-DSCH-012 }
