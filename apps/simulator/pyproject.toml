[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "queenbee-simulator"
version = "0.1.0"
description = "Simulateur de capteurs, climats, apiculteurs et scénarios QueenBee (MQTT + API de pilotage)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiomqtt>=2.3,<3.0",
  "pydantic>=2.9,<3.0",
  "pyyaml>=6.0,<7.0",
  "numpy>=2.1,<3.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=6.0,<7.0",
  "hypothesis>=6.115,<7.0",
  "types-PyYAML",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
]

[project.scripts]
queenbee-sim = "simulator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/simulator"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "ASYNC", "RUF", "NPY"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=simulator --cov-report=term-missing"
