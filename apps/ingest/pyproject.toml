[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "queenbee-ingest"
version = "0.1.0"
description = "Worker d'ingestion MQTT -> TimescaleDB, validation anti-rejeu et règles d'alerte"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiomqtt>=2.3,<3.0",
  "asyncpg>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "prometheus-client>=0.21,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=6.0,<7.0",
  "hypothesis>=6.115,<7.0",
  "testcontainers[postgres]>=4.8,<5.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
]

[project.scripts]
queenbee-ingest = "ingest.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=ingest --cov-report=term-missing"
# Règles de seuil : couverture à 100 % exigée (ROADMAP §5.6). TODO(EP-04): --cov-fail-under.
markers = ["integration: nécessite Postgres/Timescale et Mosquitto (Testcontainers)"]
