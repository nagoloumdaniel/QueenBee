[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "queenbee-api"
version = "0.1.0"
description = "API FastAPI de QueenBee (contrat OpenAPI 3.1, préfixe /api/v1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "alembic>=1.14,<2.0",
  "asyncpg>=0.30,<1.0",
  "argon2-cffi>=23.1,<26.0",
  "pyjwt>=2.9,<3.0",
  "pyotp>=2.9,<3.0",
  "slowapi>=0.1.9,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=6.0,<7.0",
  "httpx>=0.27,<1.0",
  "testcontainers[postgres]>=4.8,<5.0",
  "schemathesis>=3.38,<4.0",
  "hypothesis>=6.115,<7.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
  "pip-audit>=2.7,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "ASYNC", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert autorisé dans les tests

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"
# TODO(EP-06): ajouter --cov-fail-under=80 quand les services existent (porte CI, ROADMAP §5.3).
markers = [
  "integration: nécessite Postgres/Timescale (Testcontainers)",
  "e2e: parcours complet contre la stack Compose",
]

[tool.coverage.run]
branch = true
source = ["app"]
