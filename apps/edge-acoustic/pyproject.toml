[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "queenbee-edge-acoustic"
version = "0.1.0"
description = "Service edge : extraction de features acoustiques (FFT) sur la passerelle"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1,<3.0",
  "scipy>=1.14,<2.0",
  "aiomqtt>=2.3,<3.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "hypothesis>=6.115,<7.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
]

[project.scripts]
queenbee-edge-acoustic = "edge_acoustic.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_acoustic"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "NPY"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --cov=edge_acoustic --cov-report=term-missing"
