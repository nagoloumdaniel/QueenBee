name: queenbee
description: >-
  Application terrain QueenBee pour les apiculteurs : inspections hors ligne,
  alertes, récoltes, synchronisation (offline-first).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

# Versions indicatives validées à la rédaction du squelette.
# Au premier `flutter pub get`, committer pubspec.lock et lancer `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # État et navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Base locale chiffrée (source de l'UI : offline-first)
  drift: ^2.22.1
  sqlite3: ^2.4.7
  sqlcipher_flutter_libs: ^0.6.4
  path: ^1.9.0
  path_provider: ^2.1.5

  # Réseau et sécurité
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.3
  connectivity_plus: ^6.1.1
  uuid: ^4.5.1

  # Terrain : QR, photo, carte, graphiques
  mobile_scanner: ^6.0.2
  image_picker: ^1.1.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  fl_chart: ^0.70.1

  # Notifications push (FCM)
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6

  # i18n
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  mocktail: ^1.0.4
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
  generate: true
  # TODO(KAN-xxx, MOBILE) : embarquer les polices Inter et Fraunces (assets/fonts/)
  # puis déclarer `fonts:` ici. Tant que les fichiers n'existent pas, ne rien déclarer.
