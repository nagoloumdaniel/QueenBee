          format: date-time
    Cooperative:
      type: object
      required: [id, name, site_id]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        site_id:
          type: string
          format: uuid
        active:
          type: boolean
    Hive:
      type: object
      required: [id, code, site_id]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
